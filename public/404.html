    <title>Dhanjit Singh – React, Laravel & Web Development Services</title>

    <!-- Redirect script for GitHub Pages SPA -->
    <script type="text/javascript">
        var pathSegmentsToKeep = 0; // Change to 1 if your site is at user.github.io/portfolio/

        var l = window.location;
        if (l.pathname.indexOf('index.html') === -1) {
            var p = l.pathname.split('/').slice(1);
            if (p.length > pathSegmentsToKeep) {
                l.replace(
                    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                    '/' + p.slice(0, pathSegmentsToKeep).join('/') +
                    '/?p=/' + p.slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                    (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                    l.hash
                );
            }
        }
    </script>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- This file is served when a route is not found on the server -->
</body>

</html>
